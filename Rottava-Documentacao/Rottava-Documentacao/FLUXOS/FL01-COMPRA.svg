<text x="64" y="220.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">P02 e P03: selecionar</text>
<text x="64" y="241.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">produto</text>
<text x="64" y="265.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Escolher variante e quantidade.</text>
<rect x="50" y="361" width="276" height="132" rx="6" fill="#f2f7f7" stroke="#06858e"/>
<text x="64" y="386.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">P05 e P06: revisar compra</text>
<text x="64" y="410.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Entrar, escolher recebimento e</text>
<text x="64" y="428.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">pagamento.</text>
<rect x="370" y="527" width="276" height="132" rx="6" fill="#f2f7f7" stroke="#06858e"/>
<text x="384" y="552.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">Validar e registrar</text>
<text x="384" y="573.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">intenção</text>
<text x="384" y="597.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Resumo atual e pedido pendente,</text>
<text x="384" y="615.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">sem cobrança.</text>
<rect x="690" y="693" width="276" height="132" rx="6" fill="#f2f7f7" stroke="#06858e"/>
<text x="704" y="718.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">Disponibilidade</text>
<text x="704" y="739.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">confirmável?</text>
<text x="704" y="763.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Reserva integrada ou conferência da</text>
<text x="704" y="781.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">loja.</text>
<rect x="1010" y="859" width="276" height="132" rx="6" fill="#f2f7f7" stroke="#06858e"/>
<text x="1024" y="884.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">Conferir estoque quando</text>
<text x="1024" y="905.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">necessário</text>
<text x="1024" y="929.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Sem reserva automática, aguardar</text>
<text x="1024" y="947.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">confirmação.</text>
<rect x="370" y="1025" width="276" height="132" rx="6" fill="#f2f7f7" stroke="#06858e"/>
<text x="384" y="1050.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">Confirmar disponibilidade</text>
<text x="384" y="1074.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Atualizar o mesmo pedido, sem</text>
<text x="384" y="1092.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">duplicação.</text>
