<text x="704" y="1216.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">Processar forma de</text>
<text x="704" y="1237.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">pagamento</text>
<text x="704" y="1261.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Online: validar aprovação. Presencial:</text>
<text x="704" y="1279.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">a receber.</text>
<rect x="1010" y="1357" width="276" height="132" rx="6" fill="#f2f7f7" stroke="#06858e"/>
<text x="1024" y="1382.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">Separar pedido elegível</text>
<text x="1024" y="1406.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Seguir entrega ou retirada.</text>
