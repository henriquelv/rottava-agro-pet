<rect x="370" y="859" width="276" height="132" rx="6" fill="#f2f7f7" stroke="#06858e"/>
<text x="384" y="884.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">Chegar e conferir</text>
