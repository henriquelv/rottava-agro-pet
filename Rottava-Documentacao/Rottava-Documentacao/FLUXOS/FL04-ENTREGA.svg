<text x="384" y="1050.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">E03: registrar prova e</text>
<text x="384" y="1071.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">cobrança</text>
<text x="384" y="1095.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Entrega física e recebimento</text>
