<text x="1024" y="718.8" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#0a4a55" font-weight="700">C04: acompanhar entrega</text>
<text x="1024" y="742.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Somente própria entrega; última</text>
