<text x="384" y="929.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">Sem concluir apenas pela</text>
<text x="384" y="947.4" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#427a7e" font-weight="400">proximidade GPS.</text>
