name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
